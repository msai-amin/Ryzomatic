version: 2
updates:
  # Root npm workspace (main Vite + React app)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    versioning-strategy: widen
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - automated
    # Group patches + minors so the inbox isn't 30 PRs/week. Majors stay
    # individual so each one gets a deliberate review (react 18→19,
    # supabase-js majors, AWS SDK majors, etc).
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
    # Pin packages where a major bump is known-painful and should be
    # done deliberately, not via a noisy auto-PR.
    ignore:
      # react-pdf-viewer is on 3.x; 4.x is a partial rewrite with API breaks
      - dependency-name: "@react-pdf-viewer/*"
        update-types: ["version-update:semver-major"]
      # AWS SDK major bumps require coordinated change across S3 client/presigner
      - dependency-name: "@aws-sdk/*"
        update-types: ["version-update:semver-major"]
      # React major bumps need test plan
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # Chrome extension has its own package.json
  - package-ecosystem: npm
    directory: "/chrome-extension"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    versioning-strategy: widen
    commit-message:
      prefix: chore(extension)
      include: scope
    labels:
      - dependencies
      - automated
      - chrome-extension
    groups:
      extension-deps:
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions workflows — keep action versions current
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - automated
      - github-actions
    groups:
      github-actions:
        update-types:
          - "patch"
          - "minor"
          - "major"

